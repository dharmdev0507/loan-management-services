
spring:
  application:
    name: loan-management-services

  datasource:
    url: jdbc:h2:mem:loan-management-db
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

camunda:
  bpm:
    admin-user:
      id: admin
      password: admin123
      first-name: Loan
      last-name: Administrator
    filter:
      create: All tasks
    database:
      schema-update: true
    deployment-resource-pattern:
      - classpath*:/processes/*.bpmn

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.loan: INFO
    org.camunda.bpm: INFO
